name: native libraries

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packed NuGet package to NuGet.org.
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-libraries.yml'
      - 'native/**'
      - 'ports/**'
      - 'triplets/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - 'README.ko.md'
      - 'LICENSE.txt'

permissions:
  contents: read

concurrency:
  group: native-libraries
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  LIBVPX_VERSION: v1.16.0
  LIBYUV_COMMIT: d98915a654d3564e4802a0004add46221c4e4348
  PACKAGE_PROJECT: src/LibVpxFrameDecoder/LibVpxFrameDecoder.csproj

jobs:
  resolve-version:
    name: resolve version
    runs-on: windows-latest
    outputs:
      run: ${{ steps.version.outputs.run }}
      publish: ${{ steps.version.outputs.publish }}
      current: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the package version and the publish mode
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-ProjectVersion([string]$projectPath) {
            [xml]$project = Get-Content -LiteralPath $projectPath -Raw
            $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
            if ([string]::IsNullOrWhiteSpace($version)) { throw "Version was not found in $projectPath." }
            return $version
          }

          function Get-PreviousProjectVersion([string]$previousCommit, [string]$projectPath) {
            $previousProjectText = & git show "$previousCommit`:$projectPath" 2>$null
            if ($LASTEXITCODE -ne 0) { return $null }

            $previousProjectXml = ($previousProjectText -join "`n") -replace "^\uFEFF", ""
            [xml]$previousProject = $previousProjectXml
            $previousVersion = ($previousProject.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
            if ([string]::IsNullOrWhiteSpace($previousVersion)) { throw "Previous Version was not found in $projectPath." }
            return $previousVersion
          }

          $projectPath = "${{ env.PACKAGE_PROJECT }}"
          $currentVersion = Get-ProjectVersion $projectPath

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $shouldPublish = "${{ inputs.publish }}" -eq "true"
            "run=true" >> $env:GITHUB_OUTPUT
            "publish=$($shouldPublish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "current=$currentVersion" >> $env:GITHUB_OUTPUT
            Write-Host "Manual run for version $currentVersion (publish=$shouldPublish)."
            exit 0
          }

          $previousCommit = "${{ github.event.before }}"
          if ([string]::IsNullOrWhiteSpace($previousCommit) -or $previousCommit -match "^0+$") {
            "run=false" >> $env:GITHUB_OUTPUT
            "publish=false" >> $env:GITHUB_OUTPUT
            "current=$currentVersion" >> $env:GITHUB_OUTPUT
            Write-Host "No previous commit was available, so the build is skipped."
            exit 0
          }

          $previousVersion = Get-PreviousProjectVersion $previousCommit $projectPath
          if ($null -eq $previousVersion) {
            "run=true" >> $env:GITHUB_OUTPUT
            "publish=true" >> $env:GITHUB_OUTPUT
            "current=$currentVersion" >> $env:GITHUB_OUTPUT
            Write-Host "The package project is new, publishing version $currentVersion."
            exit 0
          }

          $shouldPublish = [System.Management.Automation.SemanticVersion]::Parse($currentVersion) -gt [System.Management.Automation.SemanticVersion]::Parse($previousVersion)
          "run=$($shouldPublish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "publish=$($shouldPublish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "current=$currentVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Current=$currentVersion Previous=$previousVersion Publish=$shouldPublish"

  windows:
    name: windows (x64, arm64)
    needs: resolve-version
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the native libraries
        shell: pwsh
        run: ./scripts/build-native-libs.ps1 -VcpkgRoot "${{ runner.temp }}/vcpkg"
      - name: Upload the x64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: native/win-x64/*
      - name: Upload the arm64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-win-arm64
          path: native/win-arm64/*

  linux:
    name: linux (${{ matrix.rid }})
    needs: resolve-version
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            target: x86_64-linux-gcc
            cc: gcc
            cxx: g++
          - rid: linux-arm64
            target: arm64-linux-gcc
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          if [ "${{ matrix.rid }}" = "linux-arm64" ]; then sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu; fi
      - name: Build libvpx
        run: |
          git clone --depth 1 --branch "$LIBVPX_VERSION" https://github.com/webmproject/libvpx.git build/libvpx
          cd build/libvpx
          ./configure --target=${{ matrix.target }} --enable-shared --disable-static --disable-examples --disable-tools --disable-docs --disable-unit-tests --prefix="$GITHUB_WORKSPACE/build/libvpx-install"
          make -j"$(nproc)"
          make install
      - name: Build libyuv
        run: |
          git clone https://chromium.googlesource.com/libyuv/libyuv build/libyuv
          cd build/libyuv
          git checkout "$LIBYUV_COMMIT"
          cmake -S . -B cmake-build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=ON -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.rid == 'linux-arm64' && 'aarch64' || 'x86_64' }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build cmake-build -j"$(nproc)"
      - name: Stage the native libraries
        run: |
          mkdir -p "native/${{ matrix.rid }}"
          cp -L "$(ls build/libvpx-install/lib/libvpx.so* | head -1)" "native/${{ matrix.rid }}/libvpx.so"
          cp -L "$(ls build/libyuv/cmake-build/libyuv.so* | head -1)" "native/${{ matrix.rid }}/libyuv.so"
          ls -l "native/${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}/*

  macos:
    name: macos (osx-arm64)
    needs: resolve-version
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libvpx
        run: |
          git clone --depth 1 --branch "$LIBVPX_VERSION" https://github.com/webmproject/libvpx.git build/libvpx
          cd build/libvpx
          ./configure --target=arm64-darwin-gcc --enable-shared --disable-static --disable-examples --disable-tools --disable-docs --disable-unit-tests --prefix="$GITHUB_WORKSPACE/build/libvpx-install"
          make -j"$(sysctl -n hw.ncpu)"
          make install
      - name: Build libyuv
        run: |
          git clone https://chromium.googlesource.com/libyuv/libyuv build/libyuv
          cd build/libyuv
          git checkout "$LIBYUV_COMMIT"
          cmake -S . -B cmake-build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=ON
          cmake --build cmake-build -j"$(sysctl -n hw.ncpu)"
      - name: Stage the native libraries
        run: |
          mkdir -p native/osx-arm64
          cp -L "$(ls build/libvpx-install/lib/libvpx.dylib* | head -1)" native/osx-arm64/libvpx.dylib
          cp -L "$(ls build/libyuv/cmake-build/libyuv.dylib* | head -1)" native/osx-arm64/libyuv.dylib
          install_name_tool -id @rpath/libvpx.dylib native/osx-arm64/libvpx.dylib
          install_name_tool -id @rpath/libyuv.dylib native/osx-arm64/libyuv.dylib
          if command -v vtool >/dev/null; then
            vtool -set-build-version macos 11.0 11.0 -replace -output native/osx-arm64/libvpx.dylib.fixed native/osx-arm64/libvpx.dylib
            mv native/osx-arm64/libvpx.dylib.fixed native/osx-arm64/libvpx.dylib
            vtool -set-build-version macos 11.0 11.0 -replace -output native/osx-arm64/libyuv.dylib.fixed native/osx-arm64/libyuv.dylib
            mv native/osx-arm64/libyuv.dylib.fixed native/osx-arm64/libyuv.dylib
          fi
          codesign --force --sign - native/osx-arm64/libvpx.dylib native/osx-arm64/libyuv.dylib
          ls -l native/osx-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: native-osx-arm64
          path: native/osx-arm64/*

  android:
    name: android (${{ matrix.rid }})
    needs: resolve-version
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: android-arm64
            triplet: arm64-android-dynamic
          - rid: android-x64
            triplet: x64-android-dynamic
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm
      - name: Locate the Android NDK
        run: |
          if [ -z "$ANDROID_NDK_LATEST_HOME" ]; then
            ANDROID_NDK_LATEST_HOME="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | tail -1)"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Build libvpx and libyuv
        run: |
          "$RUNNER_TEMP/vcpkg/vcpkg" install "libvpx:${{ matrix.triplet }}" "libyuv:${{ matrix.triplet }}" --overlay-ports=ports --overlay-triplets=triplets
      - name: Stage the native libraries
        run: |
          mkdir -p "native/${{ matrix.rid }}"
          cp -L "$RUNNER_TEMP/vcpkg/installed/${{ matrix.triplet }}/lib/libvpx.so" "native/${{ matrix.rid }}/libvpx.so"
          cp -L "$RUNNER_TEMP/vcpkg/installed/${{ matrix.triplet }}/lib/libyuv.so" "native/${{ matrix.rid }}/libyuv.so"
          ls -l "native/${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}/*

  verify:
    name: verify (${{ matrix.rid }})
    needs: [resolve-version, windows, linux, macos]
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build LibVpxFrameDecoder.slnx
      - name: List the native libraries
        shell: bash
        run: |
          echo "--- native ---"
          find native -type f | sort
          echo "--- output ---"
          find tools/FrameDump/bin -path '*runtimes*' -type f | sort
      - name: Inspect the native libraries
        shell: bash
        run: |
          dotnet run --project tools/FrameDump -- native
          if [ "$RUNNER_OS" = "Linux" ]; then ldd native/linux-x64/libyuv.so || true; file native/linux-x64/libyuv.so || true; fi
          if [ "$RUNNER_OS" = "macOS" ]; then codesign -dv native/osx-arm64/libvpx.dylib 2>&1 | head -5 || true; fi
      - name: Compare frames against ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            case "$RUNNER_OS" in
              Windows) choco install ffmpeg -y --no-progress ;;
              macOS) brew install ffmpeg ;;
              *) sudo apt-get install -y ffmpeg ;;
            esac
          fi
          dotnet run --project tools/FrameDump -- compare tests/assets --ffmpeg ffmpeg
      - name: Check premultiplied alpha
        run: dotnet run --project tools/FrameDump -- premultiply tests/assets/alpha-vp9.webm --frame 30

  pack:
    name: pack
    needs: [resolve-version, verify, android]
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge the native libraries
        run: |
          for directory in artifacts/native-*; do
            rid="${directory#artifacts/native-}"
            mkdir -p "native/$rid"
            cp -R "$directory"/. "native/$rid"/
          done
          find native -type f | sort
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Pack the NuGet package
        run: dotnet pack "$PACKAGE_PROJECT" -c Release -o artifacts/packages
      - name: Upload the package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/packages/*.nupkg
      - name: Push the package to NuGet
        if: needs.resolve-version.outputs.publish == 'true'
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY secret is not configured." >&2
            exit 1
          fi

          dotnet nuget push "artifacts/packages/LibVpxFrameDecoder.${{ needs.resolve-version.outputs.current }}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
