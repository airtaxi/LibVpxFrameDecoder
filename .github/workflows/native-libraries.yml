name: native libraries

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Build and verify the Windows (x64, ARM64) native libraries.
        required: true
        default: true
        type: boolean
      linux:
        description: Build and verify the Linux (x64, ARM64) native libraries.
        required: true
        default: true
        type: boolean
      macos:
        description: Build and verify the macOS (Apple silicon) native libraries.
        required: true
        default: true
        type: boolean
      android:
        description: Build and verify the Android (ARM64, x64) native libraries.
        required: true
        default: true
        type: boolean
      ios:
        description: Build and verify the iOS (device and simulator) static libraries.
        required: true
        default: true
        type: boolean
      maccatalyst:
        description: Build and verify the Mac Catalyst static libraries.
        required: true
        default: true
        type: boolean
      publish:
        description: Publish the packed NuGet package to NuGet.org. Requires every platform to be enabled.
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-libraries.yml'
      - 'buildTransitive/**'
      - 'native/**'
      - 'ports/**'
      - 'triplets/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - 'README.ko.md'
      - 'LICENSE.txt'

permissions:
  contents: read

concurrency:
  group: native-libraries
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  LIBVPX_VERSION: v1.16.0
  LIBYUV_COMMIT: d98915a654d3564e4802a0004add46221c4e4348
  PACKAGE_PROJECT: src/LibVpxFrameDecoder/LibVpxFrameDecoder.csproj

# Every platform of this workflow can be selected with the check boxes of a manual run, so a quick check only
# builds the platforms it needs (Windows is the slowest one). A push to main still builds everything, but only
# when the <Version> of the package project increases. The pack job needs every platform, so an incomplete
# selection never produces or publishes a partial package.
jobs:
  resolve-version:
    name: resolve version
    runs-on: windows-latest
    outputs:
      run: ${{ steps.version.outputs.run }}
      publish: ${{ steps.version.outputs.publish }}
      current: ${{ steps.version.outputs.current }}
      windows: ${{ steps.version.outputs.windows }}
      linux: ${{ steps.version.outputs.linux }}
      macos: ${{ steps.version.outputs.macos }}
      android: ${{ steps.version.outputs.android }}
      ios: ${{ steps.version.outputs.ios }}
      maccatalyst: ${{ steps.version.outputs.maccatalyst }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the package version and the publish mode
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-ProjectVersion([string]$projectPath) {
            [xml]$project = Get-Content -LiteralPath $projectPath -Raw
            $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
            if ([string]::IsNullOrWhiteSpace($version)) { throw "Version was not found in $projectPath." }
            return $version
          }

          function Get-PreviousProjectVersion([string]$previousCommit, [string]$projectPath) {
            $previousProjectText = & git show "$previousCommit`:$projectPath" 2>$null
            if ($LASTEXITCODE -ne 0) { return $null }

            $previousProjectXml = ($previousProjectText -join "`n") -replace "^\uFEFF", ""
            [xml]$previousProject = $previousProjectXml
            $previousVersion = ($previousProject.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
            if ([string]::IsNullOrWhiteSpace($previousVersion)) { throw "Previous Version was not found in $projectPath." }
            return $previousVersion
          }

          function Get-PlatformFlag([string]$value) {
            if ([string]::IsNullOrWhiteSpace($value)) { return "true" }
            return $value.ToLowerInvariant()
          }

          # One flag per platform. A push runs every platform and a manual run follows the check boxes
          # (an unchecked box arrives as false). The flags are normalized to strings, so the job conditions
          # never depend on how the runner passes boolean inputs.
          $platformFlags = [ordered]@{
            windows     = Get-PlatformFlag "${{ inputs.windows }}"
            linux       = Get-PlatformFlag "${{ inputs.linux }}"
            macos       = Get-PlatformFlag "${{ inputs.macos }}"
            android     = Get-PlatformFlag "${{ inputs.android }}"
            ios         = Get-PlatformFlag "${{ inputs.ios }}"
            maccatalyst = Get-PlatformFlag "${{ inputs.maccatalyst }}"
          }
          foreach ($platform in $platformFlags.Keys) { "$platform=$($platformFlags[$platform])" >> $env:GITHUB_OUTPUT }
          Write-Host "Platforms: $(($platformFlags.Keys | ForEach-Object { "$_=$($platformFlags[$_])" }) -join ' ')"
          Write-Host "The pack job needs every platform flag to be true."

          $projectPath = "${{ env.PACKAGE_PROJECT }}"
          $currentVersion = Get-ProjectVersion $projectPath

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $shouldPublish = "${{ inputs.publish }}".ToLowerInvariant() -eq "true"
            "run=true" >> $env:GITHUB_OUTPUT
            "publish=$($shouldPublish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "current=$currentVersion" >> $env:GITHUB_OUTPUT
            Write-Host "Manual run for version $currentVersion (publish=$shouldPublish)."
            exit 0
          }

          $previousCommit = "${{ github.event.before }}"
          if ([string]::IsNullOrWhiteSpace($previousCommit) -or $previousCommit -match "^0+$") {
            "run=false" >> $env:GITHUB_OUTPUT
            "publish=false" >> $env:GITHUB_OUTPUT
            "current=$currentVersion" >> $env:GITHUB_OUTPUT
            Write-Host "No previous commit was available, so the build is skipped."
            exit 0
          }

          $previousVersion = Get-PreviousProjectVersion $previousCommit $projectPath
          if ($null -eq $previousVersion) {
            "run=true" >> $env:GITHUB_OUTPUT
            "publish=true" >> $env:GITHUB_OUTPUT
            "current=$currentVersion" >> $env:GITHUB_OUTPUT
            Write-Host "The package project is new, publishing version $currentVersion."
            exit 0
          }

          $shouldPublish = [System.Management.Automation.SemanticVersion]::Parse($currentVersion) -gt [System.Management.Automation.SemanticVersion]::Parse($previousVersion)
          "run=$($shouldPublish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "publish=$($shouldPublish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "current=$currentVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Current=$currentVersion Previous=$previousVersion Publish=$shouldPublish"

  windows:
    name: windows (x64, arm64)
    needs: resolve-version
    if: needs.resolve-version.outputs.run == 'true' && needs.resolve-version.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the native libraries
        shell: pwsh
        run: ./scripts/build-native-libs.ps1 -VcpkgRoot "${{ runner.temp }}/vcpkg"
      - name: Upload the x64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: native/win-x64/*
      - name: Upload the arm64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-win-arm64
          path: native/win-arm64/*

  linux:
    name: linux (${{ matrix.rid }})
    needs: resolve-version
    if: needs.resolve-version.outputs.run == 'true' && needs.resolve-version.outputs.linux == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            target: x86_64-linux-gcc
            cc: gcc
            cxx: g++
          - rid: linux-arm64
            target: arm64-linux-gcc
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          if [ "${{ matrix.rid }}" = "linux-arm64" ]; then sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu; fi
      - name: Build libvpx
        run: |
          git clone --depth 1 --branch "$LIBVPX_VERSION" https://github.com/webmproject/libvpx.git build/libvpx
          cd build/libvpx
          ./configure --target=${{ matrix.target }} --enable-shared --disable-static --disable-examples --disable-tools --disable-docs --disable-unit-tests --prefix="$GITHUB_WORKSPACE/build/libvpx-install"
          make -j"$(nproc)"
          make install
      - name: Build libyuv
        run: |
          git clone https://chromium.googlesource.com/libyuv/libyuv build/libyuv
          cd build/libyuv
          git checkout "$LIBYUV_COMMIT"
          cmake -S . -B cmake-build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=ON -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.rid == 'linux-arm64' && 'aarch64' || 'x86_64' }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build cmake-build -j"$(nproc)"
      - name: Stage the native libraries
        run: |
          mkdir -p "native/${{ matrix.rid }}"
          cp -L "$(ls build/libvpx-install/lib/libvpx.so* | head -1)" "native/${{ matrix.rid }}/libvpx.so"
          cp -L "$(ls build/libyuv/cmake-build/libyuv.so* | head -1)" "native/${{ matrix.rid }}/libyuv.so"
          ls -l "native/${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}/*

  macos:
    name: macos (osx-arm64)
    needs: resolve-version
    if: needs.resolve-version.outputs.run == 'true' && needs.resolve-version.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libvpx
        run: |
          git clone --depth 1 --branch "$LIBVPX_VERSION" https://github.com/webmproject/libvpx.git build/libvpx
          cd build/libvpx
          ./configure --target=arm64-darwin-gcc --enable-shared --disable-static --disable-examples --disable-tools --disable-docs --disable-unit-tests --prefix="$GITHUB_WORKSPACE/build/libvpx-install"
          make -j"$(sysctl -n hw.ncpu)"
          make install
      - name: Build libyuv
        run: |
          git clone https://chromium.googlesource.com/libyuv/libyuv build/libyuv
          cd build/libyuv
          git checkout "$LIBYUV_COMMIT"
          cmake -S . -B cmake-build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=ON
          cmake --build cmake-build -j"$(sysctl -n hw.ncpu)"
      - name: Stage the native libraries
        run: |
          mkdir -p native/osx-arm64
          cp -L "$(ls build/libvpx-install/lib/libvpx.dylib* | head -1)" native/osx-arm64/libvpx.dylib
          cp -L "$(ls build/libyuv/cmake-build/libyuv.dylib* | head -1)" native/osx-arm64/libyuv.dylib
          install_name_tool -id @rpath/libvpx.dylib native/osx-arm64/libvpx.dylib
          install_name_tool -id @rpath/libyuv.dylib native/osx-arm64/libyuv.dylib
          if command -v vtool >/dev/null; then
            vtool -set-build-version macos 11.0 11.0 -replace -output native/osx-arm64/libvpx.dylib.fixed native/osx-arm64/libvpx.dylib
            mv native/osx-arm64/libvpx.dylib.fixed native/osx-arm64/libvpx.dylib
            vtool -set-build-version macos 11.0 11.0 -replace -output native/osx-arm64/libyuv.dylib.fixed native/osx-arm64/libyuv.dylib
            mv native/osx-arm64/libyuv.dylib.fixed native/osx-arm64/libyuv.dylib
          fi
          codesign --force --sign - native/osx-arm64/libvpx.dylib native/osx-arm64/libyuv.dylib
          ls -l native/osx-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: native-osx-arm64
          path: native/osx-arm64/*

  android:
    name: android (${{ matrix.rid }})
    needs: resolve-version
    if: needs.resolve-version.outputs.run == 'true' && needs.resolve-version.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: android-arm64
            triplet: arm64-android-dynamic
          - rid: android-x64
            triplet: x64-android-dynamic
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm
      - name: Locate the Android NDK
        run: |
          if [ -z "$ANDROID_NDK_LATEST_HOME" ]; then
            ANDROID_NDK_LATEST_HOME="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | tail -1)"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Build libvpx and libyuv
        run: |
          "$RUNNER_TEMP/vcpkg/vcpkg" install "libvpx:${{ matrix.triplet }}" "libyuv:${{ matrix.triplet }}" --overlay-ports=ports --overlay-triplets=triplets
      - name: Stage the native libraries
        run: |
          mkdir -p "native/${{ matrix.rid }}"
          cp -L "$RUNNER_TEMP/vcpkg/installed/${{ matrix.triplet }}/lib/libvpx.so" "native/${{ matrix.rid }}/libvpx.so"
          cp -L "$RUNNER_TEMP/vcpkg/installed/${{ matrix.triplet }}/lib/libyuv.so" "native/${{ matrix.rid }}/libyuv.so"
          ls -l "native/${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}/*

  ios:
    name: ios (device, simulator)
    needs: resolve-version
    if: needs.resolve-version.outputs.run == 'true' && needs.resolve-version.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select a full Xcode
        run: |
          if ! xcode-select -p | grep -q '^/Applications/Xcode'; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcode-select -p
          xcodebuild -version
      - name: Build the static libraries
        run: bash scripts/build-native-apple-static.sh ios
      - name: Inspect the static libraries
        run: |
          set -euo pipefail
          for directory in native/apple/ios-device native/apple/ios-simulator; do
            echo "--- $directory"
            ls -l "$directory"
            nm -gU "$directory/libvpx.a" | grep ' _vpx_codec_decode$'
            nm -gU "$directory/libyuv.a" | grep ' _I420AlphaToARGBMatrix$'
            nm -gU "$directory/libyuv.a" | grep ' _kYuvI601Constants$'
            nm -gU "$directory/liblvpxshim.a" | grep ' _lvpx_yuv_constants$'
          done
      - name: Check the build platforms
        run: |
          set -euo pipefail

          check_platform() {
            local archive="$1"
            local expected="$2"
            local work
            local platforms
            work="$(mktemp -d)"
            (cd "$work" && ar -x "$GITHUB_WORKSPACE/$archive")
            if ! find "$work" -name '*.o' -print -quit | grep -q .; then
              echo "$archive: no object files were extracted from the archive" >&2
              rm -rf "$work"
              return 1
            fi
            platforms="$(find "$work" -name '*.o' -exec otool -l {} + | awk '/LC_BUILD_VERSION/{found=1; next} found && /platform/{print $2; found=0}' | sort -u | tr -d ' ' | sed -e 's/^2$/IOS/' -e 's/^6$/MACCATALYST/' -e 's/^7$/IOSSIMULATOR/')"
            rm -rf "$work"
            if [ "$platforms" != "$expected" ]; then
              echo "$archive: expected the platform $expected but found: $platforms" >&2
              return 1
            fi
            echo "$archive: platform $expected"
          }

          check_platform native/apple/ios-device/libvpx.a IOS
          check_platform native/apple/ios-simulator/libvpx.a IOSSIMULATOR
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install the iOS workload
        run: dotnet workload install ios
      - name: Build the probe app
        run: |
          set -euo pipefail
          version="${{ needs.resolve-version.outputs.current }}"
          dotnet pack "$PACKAGE_PROJECT" -c Release -o artifacts/packages -p:Version="$version"
          cat > tests/probes/ios/NuGet.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="../../../artifacts/packages" />
            </packageSources>
          </configuration>
          EOF
          dotnet build tests/probes/ios/IosProbe.csproj -c Debug -f net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:LibVpxFrameDecoderProbeVersion="$version" \
            -p:EnableCodeSigning=false
      - name: Check the linked app binary
        run: |
          set -euo pipefail
          binary="$(find tests/probes/ios/bin -type f -name IosProbe -path '*.app/*' | head -1)"
          echo "binary: $binary"
          nm -g "$binary" | grep ' _vpx_codec_decode$'
          nm -g "$binary" | grep ' _I420AlphaToARGBMatrix$'
          nm -g "$binary" | grep ' _lvpx_yuv_constants$'
          nm -g "$binary" | grep ' _kYuvI601Constants$'
      - uses: actions/upload-artifact@v4
        with:
          name: native-apple-ios
          path: native/apple/**

  maccatalyst:
    name: maccatalyst (arm64)
    needs: resolve-version
    if: needs.resolve-version.outputs.run == 'true' && needs.resolve-version.outputs.maccatalyst == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select a full Xcode
        run: |
          if ! xcode-select -p | grep -q '^/Applications/Xcode'; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcode-select -p
          xcodebuild -version
      - name: Build the static libraries
        run: bash scripts/build-native-apple-static.sh maccatalyst
      - name: Inspect the static libraries
        run: |
          set -euo pipefail
          directory=native/apple/maccatalyst-arm64
          echo "--- $directory"
          ls -l "$directory"
          nm -gU "$directory/libvpx.a" | grep ' _vpx_codec_decode$'
          nm -gU "$directory/libyuv.a" | grep ' _I420AlphaToARGBMatrix$'
          nm -gU "$directory/libyuv.a" | grep ' _kYuvI601Constants$'
          nm -gU "$directory/liblvpxshim.a" | grep ' _lvpx_yuv_constants$'
      - name: Check the build platforms
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          (cd "$work" && ar -x "$GITHUB_WORKSPACE/native/apple/maccatalyst-arm64/libyuv.a")
          if ! find "$work" -name '*.o' -print -quit | grep -q .; then
            echo "no object files were extracted from libyuv.a" >&2
            exit 1
          fi
          platforms="$(find "$work" -name '*.o' -exec otool -l {} + | awk '/LC_BUILD_VERSION/{found=1; next} found && /platform/{print $2; found=0}' | sort -u | tr -d ' ' | sed -e 's/^2$/IOS/' -e 's/^6$/MACCATALYST/' -e 's/^7$/IOSSIMULATOR/')"
          rm -rf "$work"
          if [ "$platforms" != "MACCATALYST" ]; then
            echo "expected the platform MACCATALYST but found: $platforms" >&2
            exit 1
          fi
          echo "libyuv.a: platform MACCATALYST"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install the Mac Catalyst workload
        run: dotnet workload install maccatalyst
      - name: Build the probe app
        run: |
          set -euo pipefail
          version="${{ needs.resolve-version.outputs.current }}"
          dotnet pack "$PACKAGE_PROJECT" -c Release -o artifacts/packages -p:Version="$version"
          cat > tests/probes/maccatalyst/NuGet.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="../../../artifacts/packages" />
            </packageSources>
          </configuration>
          EOF
          dotnet build tests/probes/maccatalyst/MacCatalystProbe.csproj -c Debug -f net10.0-maccatalyst \
            -p:RuntimeIdentifier=maccatalyst-arm64 \
            -p:LibVpxFrameDecoderProbeVersion="$version" \
            -p:EnableCodeSigning=false
      - name: Check the linked app binary
        run: |
          set -euo pipefail
          binary="$(find tests/probes/maccatalyst/bin -type f -name MacCatalystProbe -path '*.app/*' | head -1)"
          echo "binary: $binary"
          nm -g "$binary" | grep ' _vpx_codec_decode$'
          nm -g "$binary" | grep ' _I420AlphaToARGBMatrix$'
          nm -g "$binary" | grep ' _lvpx_yuv_constants$'
          nm -g "$binary" | grep ' _kYuvI601Constants$'
      - uses: actions/upload-artifact@v4
        with:
          name: native-apple-maccatalyst
          path: native/apple/**

  verify-windows:
    name: verify (win-x64)
    needs: [resolve-version, windows]
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: native/win-x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build LibVpxFrameDecoder.slnx
      - name: List the native libraries
        shell: bash
        run: |
          echo "--- native ---"
          find native -type f | sort
          echo "--- output ---"
          find tools/FrameDump/bin -path '*runtimes*' -type f | sort
      - name: Inspect the native libraries
        shell: bash
        run: dotnet run --project tools/FrameDump -- native
      - name: Compare frames against ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then choco install ffmpeg -y --no-progress; fi
          dotnet run --project tools/FrameDump -- compare tests/assets --ffmpeg ffmpeg
      - name: Check premultiplied alpha
        run: dotnet run --project tools/FrameDump -- premultiply tests/assets/alpha-vp9.webm --frame 30

  verify-linux:
    name: verify (linux-x64)
    needs: [resolve-version, linux]
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native/linux-x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build LibVpxFrameDecoder.slnx
      - name: List the native libraries
        shell: bash
        run: |
          echo "--- native ---"
          find native -type f | sort
          echo "--- output ---"
          find tools/FrameDump/bin -path '*runtimes*' -type f | sort
      - name: Inspect the native libraries
        shell: bash
        run: |
          dotnet run --project tools/FrameDump -- native
          ldd native/linux-x64/libyuv.so || true
          file native/linux-x64/libyuv.so || true
      - name: Compare frames against ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get install -y ffmpeg; fi
          dotnet run --project tools/FrameDump -- compare tests/assets --ffmpeg ffmpeg
      - name: Check premultiplied alpha
        run: dotnet run --project tools/FrameDump -- premultiply tests/assets/alpha-vp9.webm --frame 30

  verify-macos:
    name: verify (osx-arm64)
    needs: [resolve-version, macos]
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: native/osx-arm64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build LibVpxFrameDecoder.slnx
      - name: List the native libraries
        shell: bash
        run: |
          echo "--- native ---"
          find native -type f | sort
          echo "--- output ---"
          find tools/FrameDump/bin -path '*runtimes*' -type f | sort
      - name: Inspect the native libraries
        shell: bash
        run: |
          dotnet run --project tools/FrameDump -- native
          codesign -dv native/osx-arm64/libvpx.dylib 2>&1 | head -5 || true
      - name: Compare frames against ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          dotnet run --project tools/FrameDump -- compare tests/assets --ffmpeg ffmpeg
      - name: Check premultiplied alpha
        run: dotnet run --project tools/FrameDump -- premultiply tests/assets/alpha-vp9.webm --frame 30

  verify-android:
    name: verify (android)
    needs: [resolve-version, android]
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-android-arm64
          path: native/android-arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-android-x64
          path: native/android-x64
      - name: Install the inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
      - name: Check the shared libraries
        run: |
          set -euo pipefail

          check_library() {
            local file="$1"
            local expected_machine="$2"
            echo "--- $file"
            readelf -h "$file" | grep -E 'Class|Machine'
            # 1. The architecture has to match the runtime identifier of the artifact.
            readelf -h "$file" | grep -q "$expected_machine"
            # 2. The C++ runtime has to be linked statically, so the app does not need libc++_shared.so.
            if readelf -d "$file" | grep -q 'libc++_shared'; then
              echo "$file still depends on libc++_shared.so" >&2
              exit 1
            fi
            readelf -d "$file" | grep NEEDED
            # 3. Every LOAD segment has to be aligned for the 16 KB pages of newer Android devices. The wide
            # output keeps each program header on one line, so the last column of a LOAD row is its alignment.
            local alignment
            local alignments
            alignments="$(readelf -W -l "$file" | awk '$1 == "LOAD" {print $NF}' | sort -u)"
            if [ -z "$alignments" ]; then
              echo "$file: no LOAD segments were found in the program headers" >&2
              exit 1
            fi
            while read -r alignment; do
              case "$alignment" in
                0x[0-9a-fA-F]*) ;;
                *)
                  echo "$file: could not read the LOAD alignment from 'readelf -W -l': '$alignment'" >&2
                  exit 1
                  ;;
              esac
              if [ "$((alignment))" -lt 16384 ]; then
                echo "$file: LOAD alignment $alignment is below 16 KB" >&2
                exit 1
              fi
              echo "$file: LOAD alignment $alignment"
            done <<< "$alignments"
          }

          check_library native/android-arm64/libvpx.so AArch64
          check_library native/android-arm64/libyuv.so AArch64
          check_library native/android-x64/libvpx.so X86-64
          check_library native/android-x64/libyuv.so X86-64

          # 4. The functions and data symbols the managed decoder resolves at run time have to be exported.
          nm -D native/android-arm64/libvpx.so | grep 'vpx_codec_decode$'
          nm -D native/android-arm64/libyuv.so | grep 'I420AlphaToARGBMatrix$'
          nm -D native/android-arm64/libyuv.so | grep 'kYuvI601Constants$'
          nm -D native/android-x64/libvpx.so | grep 'vpx_codec_decode$'
          nm -D native/android-x64/libyuv.so | grep 'I420AlphaToARGBMatrix$'
          nm -D native/android-x64/libyuv.so | grep 'kYuvI601Constants$'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install the Android workload
        run: dotnet workload install android
      - name: Build the probe app
        run: |
          set -euo pipefail
          version="${{ needs.resolve-version.outputs.current }}"
          dotnet pack "$PACKAGE_PROJECT" -c Release -o artifacts/packages -p:Version="$version"
          cat > tests/probes/android/NuGet.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="../../../artifacts/packages" />
            </packageSources>
          </configuration>
          EOF
          dotnet publish tests/probes/android/AndroidProbe.csproj -c Debug -f net10.0-android \
            -p:LibVpxFrameDecoderProbeVersion="$version"
      - name: Check the APK contents
        run: |
          set -euo pipefail
          apk="$(find tests/probes/android/bin -name '*.apk' | sort | head -1)"
          echo "APK: $apk"
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/' || true
          for abi in arm64-v8a x86_64; do
            for library in libvpx.so libyuv.so; do
              if ! unzip -l "$apk" | grep -q "lib/$abi/$library"; then
                echo "lib/$abi/$library is missing from the APK" >&2
                exit 1
              fi
            done
          done

  pack:
    name: pack
    needs: [resolve-version, verify-windows, verify-linux, verify-macos, verify-android, ios, maccatalyst]
    if: needs.resolve-version.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge the native libraries
        run: |
          set -euo pipefail
          mkdir -p native
          for artifact in artifacts/*; do
            name="${artifact#artifacts/}"
            case "$name" in
              native-apple-ios|native-apple-maccatalyst) destination="native/apple" ;;
              native-*) destination="native/${name#native-}" ;;
              *) continue ;;
            esac
            mkdir -p "$destination"
            cp -R "$artifact"/. "$destination"/
          done
          find native -type f | sort
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Pack the NuGet package
        run: dotnet pack "$PACKAGE_PROJECT" -c Release -o artifacts/packages
      - name: Upload the package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/packages/*.nupkg
      - name: Push the package to NuGet
        if: needs.resolve-version.outputs.publish == 'true'
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY secret is not configured." >&2
            exit 1
          fi

          dotnet nuget push "artifacts/packages/LibVpxFrameDecoder.${{ needs.resolve-version.outputs.current }}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
